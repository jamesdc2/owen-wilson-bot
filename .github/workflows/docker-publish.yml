name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - typescript-refactor
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          # main -> :latest (prod), any other branch -> :dev (test stack)
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/owen-wilson-bot:${{ github.ref_name == 'main' && 'latest' || 'dev' }}